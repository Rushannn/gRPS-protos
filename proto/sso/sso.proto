syntax = "proto3";

package auth;

option go_package = "tuzov.sso.v1;ssov1";

// Auth provides authentication and authorization RPCs.
service Auth {
  // Register creates a new user account.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login authenticates a user and returns an access token.
  rpc Login(LoginRequest) returns (LoginResponse);
  // IsAdmin checks whether a user has admin privileges.
  rpc IsAdmin(IsAdminRequest) returns (IsAdminResponse);
}

message RegisterRequest {
  string email = 1; //Email of the user to register.
  string password = 2; //Password of the user to register.
}

message RegisterResponse {
  int64 user_id = 1; //User ID of the registered user.
}

message LoginRequest {
  string email = 1; //Email for the user login.
  string password = 2; //Password of the user to login.
  int32 app_id = 3; //ID of the app to login to.
}

message LoginResponse {
  string token = 1; //Auth token of the logged in user.
}

message IsAdminRequest {
  int64 user_id = 1; //User to validate.
}

message IsAdminResponse {
  bool is_admin = 1; //Indicates whether the user is an admin.
}
